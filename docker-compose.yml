services:
  gateway:
    build: .
    ports:
      - "8080:8080"
      - "9100:9100"
    environment:
      REDIS_LIVE_EVENTS_URL: redis:6379
      STREAM_TTL: 1h
      WRITE_MAX_RETRIES: "2"
      WRITE_BACKOFF_BASE: 50ms
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
