name: Deploy

on:
  workflow_run:
    workflows: [Publish]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Full commit SHA to deploy (leave empty to deploy latest main SHA)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to staging
    if: >-
      vars.STAGING_AUTO_DEPLOY == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RUN_HEAD_SHA" ]]; then
            echo "tag=$RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git ls-remote https://github.com/port-labs/ocean-gateway.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          fi

      - uses: port-labs/infra-apps/.github/actions/change-service-tag@main
        with:
          SERVICE_NAME: ocean-gateway
          ENVIRONMENT: ocean-stg-01
          RUNTIME: staging
          AWS_REGION: eu-west-1
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          CLUSTER_FLAVOR: apps
          CLUSTER_NUMBER: "01"
          github_token: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}
          ENV_ACCOUNT_ID_OBJECT: ${{ vars.ENV_ACCOUNT_ID_OBJECT }}
