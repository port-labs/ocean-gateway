name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_MACHINE_USER }}
          password: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/port-labs/ocean-gateway:${{ steps.tag.outputs.tag }}
            ghcr.io/port-labs/ocean-gateway:latest
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/port-labs/ocean-gateway:${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/port-labs/ocean-gateway:latest\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to staging
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.STAGING_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: port-labs/infra-apps/.github/actions/change-service-tag@main
        with:
          SERVICE_NAME: ocean-gateway
          ENVIRONMENT: ocean-stg-01
          RUNTIME: staging
          AWS_REGION: eu-west-1
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
          CLUSTER_FLAVOR: apps
          CLUSTER_NUMBER: "01"
          github_token: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}
          ENV_ACCOUNT_ID_OBJECT: ${{ vars.ENV_ACCOUNT_ID_OBJECT }}
