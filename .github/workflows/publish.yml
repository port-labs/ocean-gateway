name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tags
        id: tag
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_MACHINE_USER }}
          password: ${{ secrets.PORT_MACHINE_USER_GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/port-labs/ocean-gateway:${{ steps.tag.outputs.image_tag }}
            ghcr.io/port-labs/ocean-gateway:latest
          build-args: |
            VERSION=${{ steps.tag.outputs.image_tag }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}

      - name: Create git tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.tag.outputs.git_tag }}
          tag_prefix: ""

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`ghcr.io/port-labs/ocean-gateway:${{ steps.tag.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`ghcr.io/port-labs/ocean-gateway:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Git tag: \`${{ steps.tag.outputs.git_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
