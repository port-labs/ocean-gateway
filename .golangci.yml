version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck  # includes gosimple (merged in v2)
    - ineffassign
    - unused
    - misspell
    - revive
    - bodyclose
    - noctx
    - gocritic
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gocritic: {}
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - noctx  # httptest.NewRequest has no WithContext variant

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
